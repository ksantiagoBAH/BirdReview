name: Deploy BirdReview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'little-bird-club/dist/**'
      - '.github/workflows/bird-review-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check little-bird-club/dist/app.js
          node --check little-bird-club/dist/game.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: little-bird-club/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
